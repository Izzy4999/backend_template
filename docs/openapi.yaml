openapi: 3.0.3
info:
  title: API Documentation
  version: 1.0.0
  description: |
    OpenAPI documentation for the backend template.
    Auth session behavior is controlled by `AUTH_SESSION_MODE` (.env):
    - **single** (default): one refresh token per user; logout logs out everywhere; refresh returns new access token only.
    - **multi**: multiple refresh tokens per user; logout revokes only the token sent; refresh rotates and returns new access + refresh.
servers:
  - url: /api
    description: Base API path

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

tags:
  - name: Auth
    description: Authentication endpoints

paths:
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: |
        **single mode:** New access token only; same refresh token returned.
        **multi mode:** New access token and new refresh token (rotation).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required: [refreshToken]
      responses:
        '200':
          description: New access token (and same refresh token)
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        '400':
          description: Missing refresh token
        '403':
          description: Invalid or expired refresh token
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: |
        **single mode:** Invalidates the user's refresh token (logs out all devices). Send refreshToken in body or Bearer access token in Authorization header.
        **multi mode:** Revokes only the refresh token sent in body (current session only).
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Logged out
